apply plugin: 'com.android.application'

android {
    namespace 'com.bh.android.TargetHomeLauncher'
    compileSdkVersion 33

    defaultConfig {
        applicationId "com.bh.android.TargetHomeLauncher"
        minSdkVersion 3
        targetSdkVersion 33
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}